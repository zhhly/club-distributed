    publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAI0h+Q9d4eZ9IdZi0/sEit+h2MIODXMe/dBWvq7Ige0O7Oe0hd4SLSVWz0Vw9PImB6GJzw4/GbDLq63Z2CwbDRsCAwEAAQ==
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      filters: config,stat,wall
      connectionProperties: config.decrypt=false; config.decrypt.key=${publicKey};
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # 密码解密配置（关键部分）
      # Filter配置
      filter:
        config:
          enabled: true
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
        wall:
          enabled: true
      # 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123

# MyBatis配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.club.subject.infra.basic.entity

